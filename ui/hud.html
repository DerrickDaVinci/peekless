<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekless</title>
<link rel="stylesheet" href="style.css">
<style>
  /* The card floats over other apps: transparent window, card drawn inside. */
  html, body { background: transparent !important; overflow: hidden; }
  body { padding: 8px 10px 12px; height: 100%; }
  .card { height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 0; border-radius: 14px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 18px 40px -14px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .08); overflow: hidden; position: relative; }
  .hd { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .hd-icon { width: 18px; height: 18px; border-radius: 5px; }
  .hd .x { margin-left: auto; width: 22px; height: 22px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 15px; line-height: 1; }
  .hd .x:hover { background: var(--panel-2); color: var(--ink); }
  .pv { flex: 1; min-height: 0; display: grid; place-items: center; border-radius: 8px; background: var(--panel-2); overflow: hidden; }
  .pv canvas { display: block; max-width: 100%; max-height: 100%; border-radius: 4px; }
  .pv pre { margin: 0; width: 100%; padding: 10px 12px; font: 11.5px/1.6 var(--f-mono); color: var(--ink-2); white-space: pre-wrap; word-break: break-all; align-self: stretch; }
  .pv pre b { font-weight: 600; color: #F4F6FA; background: var(--bar); border-radius: 3px; padding: 0 4px; }
  .ti { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.35; }
  .ti small { display: block; font-size: 12.5px; font-weight: 400; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .done .ti::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--low); margin: 0 7px 1px 0; }
  .acts { display: flex; gap: 6px; align-items: center; padding-bottom: 14px; }
  .acts .btn { height: 32px; font-size: 13px; padding: 0 12px; }
  .acts .btn.primary { flex: 1; }
  .acts .link { margin-left: auto; border: 0; background: none; color: var(--accent); font-size: 12.5px; cursor: pointer; padding: 4px 2px; }
  .acts .link:hover { text-decoration: underline; }
  .timer { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--accent); opacity: .55; transform-origin: left; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hd"><img src="brand.png" alt="" class="hd-icon"><span>Peekless</span><button class="x" type="button" id="x" aria-label="Close">×</button></div>
  <div class="pv" id="pv"></div>
  <div class="ti" id="ti"></div>
  <div class="acts" id="acts"></div>
  <div class="timer"><i id="bar"></i></div>
</div>
<script src="preview-mock.js"></script>
<script src="shared.js"></script>
<script src="hud.js"></script>
</body>
</html>
