<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peekless</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent !important; overflow: hidden; width: 300px; height: 300px; }
  /* The ring floats over any wallpaper or window, so it carries its own shadow. */
  svg { display: block; width: 300px; height: 300px; overflow: visible; filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .30)) drop-shadow(0 1px 2px rgba(0, 0, 0, .18)); }
  svg.in { animation: pop .17s cubic-bezier(.2, .9, .3, 1.25); }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  .rh .big { fill: var(--ink); font: 700 15px var(--f-ui); }
  .rh .ok { fill: var(--low); }
  .rh .err { fill: var(--high); }
  .spin { transform-origin: 150px 150px; animation: spin .8s linear infinite; fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .count { fill: var(--accent); }
  .count-t { fill: var(--on-accent); font: 700 11px var(--f-ui); text-anchor: middle; }
</style>
</head>
<body>
<svg id="ring" class="ring-svg" viewBox="0 0 300 300" aria-hidden="true"></svg>
<script src="preview-mock.js"></script>
<script src="shared.js"></script>
<script src="ring.js"></script>
</body>
</html>
