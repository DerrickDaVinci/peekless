name: Release

# Push a tag like v0.1.0 to build installers for macOS (Apple Silicon and
# Intel) and Windows. They are attached to a draft GitHub Release for review.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Peekless ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below.
            First launch on macOS: right-click Peekless.app and choose Open (the app is not notarized yet).
            First launch on Windows: if SmartScreen appears, click More info, then Run anyway.
          releaseDraft: true
          args: --target ${{ matrix.target }}
