name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please cover any real personal data in screenshots before attaching them (Peekless can do it for you)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Peekless version and OS
      placeholder: "0.1.0, macOS 15.2"
    validations:
      required: true
